apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlops-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: mlops-app

  template:
    metadata:
      labels:
        app: mlops-app

    spec:
      containers:
      - name: mlops-app
        image: g25ai1052/mlops-major:v1
        

        ports:
        - containerPort: 5000